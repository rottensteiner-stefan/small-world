<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Small World - Example 9</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .back-btn {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px 10px;
        text-decoration: none;
        border-radius: 4px;
        z-index: 1000;
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      #info {
        position: absolute;
        top: 50px;
        left: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.3);
        padding: 10px;
        border-radius: 8px;
        pointer-events: none;
        z-index: 900;
      }

      #info h1 {
        margin: 0 0 10px 0;
        font-size: 1.2rem;
      }

      #info p {
        margin: 5px 0;
        font-size: 0.9rem;
      }
    </style>
    <script type="module" crossorigin src="/examples/example9/demo.js"></script>
    <link rel="modulepreload" crossorigin href="/js/AbstractExample.js">
    <link rel="modulepreload" crossorigin href="/js/Cube.js">
    <link rel="modulepreload" crossorigin href="/js/Texture.js">
    <link rel="modulepreload" crossorigin href="/js/PhongMaterial.js">
    <link rel="modulepreload" crossorigin href="/js/Sphere.js">
    <link rel="modulepreload" crossorigin href="/js/AmbientLight.js">
  </head>
  <body>
    <a href="/" class="back-btn">← Zurück zur Übersicht</a>
    <div id="info">
      <h1>Example 9: Skydome & FPS Controls</h1>
      <p>Click to capture mouse. ESC to release.</p>
      <p>WASD to move, Q/E to fly up/down.</p>
      <p>Shift + 1/2/3 to switch Renderer.</p>
    </div>

    <canvas id="SmallWorld"></canvas>

  </body>
</html>
