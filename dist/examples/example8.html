<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Small World - Example 8 (2.5D Jump & Run)</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #87ceeb; /* Sky blue fallback */
        font-family: sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        pointer-events: none;
        text-shadow: 1px 1px 2px black;
      }
      .back-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px 10px;
        text-decoration: none;
        font-family: sans-serif;
        border-radius: 4px;
        z-index: 1000;
        pointer-events: auto;
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
    <script type="module" crossorigin src="/examples/example8/demo.js"></script>
    <link rel="modulepreload" crossorigin href="/js/AbstractExample.js">
  </head>
  <body>
    <a href="/" class="back-btn">← Zurück zur Übersicht</a>
    <div id="info">
      <h1>Example 8: 2.5D Jump & Run</h1>
      <p>A/D = Move Left/Right</p>
      <p>SPACE = Jump</p>
    </div>

    <canvas id="SmallWorld"></canvas>

  </body>
</html>
