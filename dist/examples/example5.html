<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmallWorld Engine - Demo 5: Isometrische Kamera & 2D</title>
    <style>
      /* Resets für Fullscreen-Canvas */
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #111;
        font-family: Arial, sans-serif;
      }
      canvas {
        display: block;
      }
      /* Ein kleines Overlay für den User */
      #overlay {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.6);
        padding: 15px;
        border-radius: 8px;
        pointer-events: none; /* Klicks gehen durch aufs Canvas */
        user-select: none;
      }
    </style>
    <script type="module" crossorigin src="/examples/example5/demo.js"></script>
    <link rel="modulepreload" crossorigin href="/js/AbstractExample.js">
    <link rel="modulepreload" crossorigin href="/js/Cube.js">
    <link rel="modulepreload" crossorigin href="/js/Grid.js">
    <link rel="modulepreload" crossorigin href="/js/PhongMaterial.js">
    <link rel="modulepreload" crossorigin href="/js/WireframeMaterial.js">
    <link rel="modulepreload" crossorigin href="/js/AmbientLight.js">
  </head>
  <body>
    <div id="overlay">
      <h2>Demo 5: Isometrische Kamera & 2D</h2>
      <p>⌨️ <b>WASD</b>: Bewegen auf dem Raster</p>
      <p>🖱️ <b>Klick</b>: Gehe zu Ziel (Screen-to-World Mapping)</p>
      <p>⌨️ <b>Taste 'P'</b>: Pixel-Perfect Snapping Ein/Aus</p>
      <p>⌨️ <b>Taste 'I'</b>: Debug-Infos in Konsole</p>
    </div>

    <canvas id="SmallWorld"></canvas>

  </body>
</html>
