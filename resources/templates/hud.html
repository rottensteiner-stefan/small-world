<style>
  #sw-hud-root {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #00ff00;
    font-family: "Courier New", monospace;
    font-size: 14px;
    background-color: rgba(0, 0, 0, 0.6);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(0, 255, 0, 0.2);
    pointer-events: none;
    min-width: 240px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  }
  .hud-line {
    margin: 4px 0;
    display: flex;
    justify-content: space-between;
  }
  .hud-label {
    color: #888;
    margin-right: 8px;
  }
  .hud-value {
    color: #0f0;
    font-weight: bold;
  }
  .hud-score {
    color: #ffff00;
    font-size: 18px;
    text-shadow: 0 0 5px #ff0;
  }
  .coord-box {
    display: flex;
    gap: 8px;
  }
</style>
<div id="sw-hud-root">
  <div style="font-weight: bold; color: #fff">SmallWorld {sm-engine-version}</div>
  <hr style="border: 0; border-top: 1px solid #0f03; margin: 8px 0" />
  <div class="hud-line">
    <span class="hud-label">FPS:</span><span id="hud-fps" class="hud-value">0</span>
  </div>
  <div class="hud-line">
    <span class="hud-label">CAM:</span><span id="hud-cam" class="hud-value">-</span>
  </div>
  <div class="hud-line">
    <span class="hud-label">POS:</span>
    <div class="coord-box">
      <span>X:<span id="hud-pos-x" class="hud-value">0</span></span>
      <span>Y:<span id="hud-pos-y" class="hud-value">0</span></span>
      <span>Z:<span id="hud-pos-z" class="hud-value">0</span></span>
    </div>
  </div>
  <hr style="border: 0; border-top: 1px solid #0f03; margin: 8px 0" />
  <div class="hud-line">
    <span class="hud-label">COLLECTED:</span>
    <span id="hud-score" class="hud-score">0 / 0</span>
  </div>
</div>
