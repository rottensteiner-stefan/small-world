<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Small World - Example 9</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .back-btn {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px 10px;

        font-family: sans-serif;
        border-radius: 4px;
        z-index: 1000;
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>

  <body>
  <a href="/" class="back-btn">← Zurück zur Übersicht</a>
  <div id="info">
    <h1>Example 7: Skydome & FPS Controls</h1>
    <p>Click to capture mouse. ESC to release.</p>
    <p>WASD to move, Q/E to fly up/down.</p>
    <p>Shift + 1/2/3 to switch Renderer.</p>
  </div>

    <canvas id="SmallWorld"></canvas>

    <script type="module" src="./example9.ts"></script>
