<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmallWorld Engine - Demo 4: Terrain & Auto</title>
    <style>
        /* Resets für Fullscreen-Canvas */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        /* Ein kleines Overlay für den User */
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none; /* Klicks gehen durch aufs Canvas */
            user-select: none;
        }
    </style>
</head>
<body>
<div id="overlay">
    <h2>Demo 4: Terrain & Auto</h2>
    <p>🖱️ <b>Klick</b>: Kamera steuern (PointerLock)</p>
    <p>⌨️ <b>Taste 'I'</b>: Debug-Infos in Konsole</p>
</div>

<canvas id="SmallWorld"></canvas>

<script type="module" src="./demo4.js"></script>
</body>
</html>
