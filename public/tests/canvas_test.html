<!doctype html>
<html>
  <head>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Canvas roundRect Test</title>
  </head>
  <body>
    <h1>Canvas roundRect Support Diagnostic</h1>
    <div
      id="result"
      style="padding: 20px; font-family: monospace; white-space: pre-wrap; border: 1px solid #ccc"
    >
      Testing...
    </div>
    <canvas id="testCanvas" width="100" height="100" style="border: 1px solid red"></canvas>

    <script>
      const resultDiv = document.getElementById("result");
      const canvas = document.getElementById("testCanvas");
      const ctx = canvas.getContext("2d");

      let log = "";
      function report(msg) {
        log += msg + "\n";
        resultDiv.textContent = log;
      }

      report("Canvas Context: " + (ctx ? "OK" : "FAILED"));

      if (ctx) {
        const isSupported = typeof ctx.roundRect === "function";
        report("roundRect supported: " + isSupported);

        if (isSupported) {
          try {
            ctx.fillStyle = "blue";
            ctx.beginPath();
            ctx.roundRect(10, 10, 80, 80, 20);
            ctx.fill();
            report("roundRect execution: SUCCESS");
          } catch (e) {
            report("roundRect execution: FAILED (" + e.message + ")");
          }
        } else {
          report("Advice: Use 'rect' or a polyfill instead of 'roundRect'.");
        }
      }
    </script>
  </body>
</html>
