<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="stylesheet" href="/assets/shared.css" />
    <title>Maker - Small World</title>
    <style>
      :root {
        --bg-color: #0b0f19;
        --panel-bg: rgba(20, 25, 40, 0.9);
        --text-color: #e0e0e0;
        --accent: #00e5ff;
        --border-color: #263048;
      }
      body {
        margin: 0;
        font-family: "Rajdhani", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .maker-layout {
        flex: 1;
        display: grid;
        grid-template-columns: 220px 1fr 280px;
        overflow: hidden;
      }
      .maker-sidebar {
        display: flex;
        flex-direction: column;
        background: var(--panel-bg);
        border-right: 1px solid var(--border-color);
        overflow-y: auto;
      }
      .maker-sidebar.right {
        border-right: none;
        border-left: 1px solid var(--border-color);
      }
      .maker-panel-title {
        padding: 8px 10px;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.7;
        border-bottom: 1px solid var(--border-color);
      }
      #maker-hierarchy {
        flex: 1;
        overflow-y: auto;
        min-height: 120px;
        display: flex;
        flex-direction: column;
      }
      .maker-hierarchy-search-wrapper {
        padding: 6px;
        border-bottom: 1px solid var(--border-color);
        background: rgba(10, 15, 25, 0.6);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .maker-hierarchy-search-input {
        width: 100%;
        box-sizing: border-box;
        background: #141a29;
        color: #e0e0e0;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 4px 8px;
        font-family: inherit;
        font-size: 0.8rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .maker-hierarchy-search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 6px rgba(0, 229, 255, 0.35);
      }
      .maker-hierarchy-tree {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }
      .maker-hierarchy-row {
        padding: 4px 6px;
        font-size: 0.9rem;
        cursor: pointer;
        white-space: nowrap;
        border-radius: 3px;
      }
      .maker-hierarchy-row:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .maker-hierarchy-row.selected {
        background: rgba(0, 229, 255, 0.2);
        color: var(--accent);
      }
      .maker-hierarchy-rename-input {
        background: #101524;
        color: #fff;
        border: 1px solid var(--accent);
        border-radius: 3px;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 1px 4px;
        width: calc(100% - 8px);
        outline: none;
        box-shadow: 0 0 5px rgba(0, 229, 255, 0.4);
      }
      #maker-palette {
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .maker-palette-section {
        margin: 10px 0 4px;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.65;
        font-weight: 600;
      }
      .maker-palette-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-bottom: 6px;
      }
      .maker-palette-tile {
        background: #141b2a;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 5px 2px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        transition: all 0.15s ease;
        min-height: 44px;
      }
      .maker-palette-tile:hover {
        background: #1c263c;
        border-color: var(--accent);
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 2px 6px rgba(0, 229, 255, 0.25);
      }
      .maker-palette-tile:active {
        transform: translateY(0);
      }
      .maker-palette-icon {
        font-size: 1.15rem;
        line-height: 1;
      }
      .maker-palette-label {
        font-size: 0.68rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        opacity: 0.9;
      }
      .maker-palette-btn {
        background: #1a2233;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 8px;
        cursor: pointer;
        font-size: 0.85rem;
        text-align: left;
      }
      .maker-palette-btn:hover {
        border-color: var(--accent);
      }
      .maker-palette-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(0, 229, 255, 0.15);
      }
      .maker-prefab-save-row {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
      }
      .maker-prefab-name-input {
        flex: 1;
        min-width: 0;
        background: #1a2233;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 0.85rem;
      }
      .maker-prefab-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .maker-prefab-btn {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .maker-prefab-thumb {
        width: 28px;
        height: 28px;
        object-fit: cover;
        border-radius: 3px;
        flex-shrink: 0;
        background: #05070d;
      }
      .maker-map-textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 70px;
        background: #1a2233;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 0.8rem;
        font-family: monospace;
        resize: vertical;
        margin-bottom: 4px;
      }
      .maker-gizmo-toolbar {
        display: flex;
        gap: 4px;
        margin-bottom: 6px;
      }
      .maker-gizmo-toolbar .maker-palette-btn {
        flex: 1;
        text-align: center;
        padding: 6px 2px;
        font-size: 0.75rem;
      }
      .maker-viewport {
        position: relative;
        background: #05070d;
      }
      .maker-marquee-box {
        position: absolute;
        border: 1px dashed var(--accent);
        background: rgba(0, 229, 255, 0.12);
        pointer-events: none;
        display: none;
        z-index: 10;
      }
      #MakerCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #maker-properties {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 24px;
      }
      #maker-properties .tp-fldv {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 8px;
        margin-bottom: 8px;
      }
      #maker-properties .tp-fldv_c {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 6px;
      }
      .maker-status {
        padding: 4px 12px;
        font-size: 0.8rem;
        opacity: 0.7;
        border-top: 1px solid var(--border-color);
        background: var(--panel-bg);
      }
      .maker-prop-row {
        display: flex;
        gap: 6px;
        width: 100%;
        margin-top: 4px;
        align-items: center;
      }
      .maker-prop-row > * {
        flex: 1 1 0;
        min-width: 0;
        margin-top: 0 !important;
      }
      .maker-prop-row .tp-lblv {
        padding: 0 2px !important;
        display: flex !important;
        align-items: center !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }
      .maker-prop-row .tp-lblv_l {
        flex: 1 1 auto !important;
        padding-right: 4px !important;
        font-size: 11px !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }
      .maker-prop-row .tp-lblv_v {
        width: auto !important;
        flex: 0 0 auto !important;
        min-width: 22px !important;
      }
      .maker-prop-row .tp-ckbv_w {
        width: 18px !important;
        height: 18px !important;
      }
      .maker-prop-row .tp-txtv_i,
      .maker-prop-row .tp-sldtxtv {
        width: 100% !important;
      }
      .maker-behavior-menu-btn {
        position: absolute;
        top: 2px;
        right: 22px;
        z-index: 10;
        width: 20px;
        height: 20px;
        background: transparent;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        line-height: 1;
        padding: 0;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s ease, background 0.15s ease;
      }
      .maker-behavior-menu-btn:hover {
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.2);
      }
      .maker-behavior-dropdown {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        padding: 4px;
        min-width: 140px;
        font-family: inherit;
      }
      .maker-behavior-dropdown-item {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        box-sizing: border-box;
        padding: 6px 10px;
        background: transparent;
        border: none;
        color: #e2e8f0;
        font-size: 0.75rem;
        cursor: pointer;
        border-radius: 4px;
        text-align: left;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .maker-behavior-dropdown-item:hover {
        background: #334155;
        color: #fff;
      }
      .maker-behavior-dropdown-danger:hover {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }

      /* Unreal Engine 5 Style Content Drawer */
      .maker-content-drawer-wrapper {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        pointer-events: none;
        display: flex;
        flex-direction: column;
      }
      .maker-content-toggle-bar {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #0c121e;
        border-top: 1px solid #1e293b;
        padding: 2px 10px;
        height: 26px;
        user-select: none;
      }
      .maker-content-toggle-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 6px;
        border-radius: 4px;
        transition: all 0.15s;
      }
      .maker-content-toggle-btn:hover {
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.1);
      }
      .maker-content-toggle-btn.active {
        color: #38bdf8;
      }
      .drawer-shortcut {
        font-size: 0.65rem;
        background: #1e293b;
        color: #64748b;
        padding: 1px 4px;
        border-radius: 3px;
        margin-left: 4px;
      }
      .maker-content-badge {
        font-size: 0.72rem;
        color: #64748b;
      }
      .maker-content-drawer {
        pointer-events: auto;
        height: 0;
        overflow: hidden;
        background: rgba(12, 18, 30, 0.95);
        backdrop-filter: blur(8px);
        border-top: 1px solid #26334d;
        display: flex;
        flex-direction: column;
        transition: height 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
      }
      .maker-content-drawer-wrapper.open .maker-content-drawer {
        height: 280px;
      }
      .maker-content-resizer {
        height: 5px;
        cursor: row-resize;
        background: transparent;
        transition: background 0.15s;
        margin-top: -2px;
      }
      .maker-content-resizer:hover {
        background: #00e5ff;
      }
      .maker-content-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        border-bottom: 1px solid #1e293b;
        background: rgba(8, 12, 20, 0.8);
      }
      .maker-content-breadcrumbs {
        display: flex;
        align-items: center;
        font-size: 0.75rem;
        color: #94a3b8;
        white-space: nowrap;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .maker-crumb {
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
      }
      .maker-crumb:hover {
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.1);
      }
      .maker-crumb-sep {
        color: #475569;
        margin: 0 2px;
      }
      .maker-content-filters {
        display: flex;
        gap: 4px;
      }
      .maker-filter-pill {
        background: #141c2c;
        border: 1px solid #26334d;
        color: #94a3b8;
        font-size: 0.72rem;
        padding: 2px 8px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }
      .maker-filter-pill:hover {
        border-color: #38bdf8;
        color: #fff;
      }
      .maker-filter-pill.active {
        background: #0284c7;
        border-color: #38bdf8;
        color: #fff;
        font-weight: 600;
      }
      .maker-content-search-box {
        position: relative;
        width: 150px;
      }
      .maker-content-search-input {
        width: 100%;
        box-sizing: border-box;
        background: #141c2c;
        border: 1px solid #26334d;
        border-radius: 4px;
        color: #e2e8f0;
        font-size: 0.75rem;
        padding: 3px 8px;
        outline: none;
        font-family: inherit;
      }
      .maker-content-search-input:focus {
        border-color: #00e5ff;
        box-shadow: 0 0 6px rgba(0, 229, 255, 0.35);
      }
      .maker-content-action-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.85rem;
      }
      .maker-content-action-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
      }
      .maker-content-action-btn.pinned {
        color: #00e5ff;
      }
      .maker-content-body {
        display: grid;
        grid-template-columns: 190px 1fr;
        flex: 1;
        overflow: hidden;
      }
      .maker-content-tree-pane {
        border-right: 1px solid #1e293b;
        overflow-y: auto;
        padding: 6px 0;
        background: rgba(10, 15, 25, 0.6);
      }
      .maker-tree-header {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #64748b;
        padding: 4px 10px;
        font-weight: 700;
      }
      .maker-tree-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .maker-tree-node {
        padding: 4px 10px;
        font-size: 0.78rem;
        color: #cbd5e1;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: none;
        transition: background 0.12s;
      }
      .maker-tree-node:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
      }
      .maker-tree-node.selected {
        background: rgba(0, 229, 255, 0.15);
        color: #00e5ff;
        font-weight: 600;
      }
      .maker-content-grid-pane {
        overflow-y: auto;
        padding: 8px 10px;
        flex: 1;
      }
      .maker-content-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 8px;
      }
      .maker-asset-card {
        background: #141b2a;
        border: 1px solid #26334d;
        border-radius: 6px;
        padding: 4px;
        display: flex;
        flex-direction: column;
        cursor: grab;
        user-select: none;
        transition: all 0.15s;
        position: relative;
        overflow: hidden;
      }
      .maker-asset-card:hover {
        border-color: #00e5ff;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 229, 255, 0.25);
        background: #1a2336;
      }
      .maker-asset-card:active {
        cursor: grabbing;
      }
      .maker-asset-thumb {
        width: 100%;
        aspect-ratio: 1;
        background: #070a12;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .maker-asset-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .maker-asset-icon-placeholder {
        font-size: 1.8rem;
      }
      .maker-asset-type-badge {
        position: absolute;
        top: 3px;
        left: 3px;
        font-size: 0.52rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        padding: 1px 4px;
        border-radius: 3px;
        text-transform: uppercase;
        background: rgba(0, 0, 0, 0.75);
      }
      .badge-prop {
        color: #38bdf8;
      }
      .badge-texture {
        color: #f59e0b;
      }
      .badge-decal {
        color: #ec4899;
      }
      .badge-primitive {
        color: #10b981;
      }
      .badge-light {
        color: #fbbf24;
      }
      .badge-prefab {
        color: #a855f7;
      }
      .maker-asset-name {
        font-size: 0.7rem;
        color: #e2e8f0;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
      }
      .maker-content-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #64748b;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header class="tool-header">
      <h1>Maker - Small World</h1>
      <a href="/" class="nav-btn">Back to Engine</a>
    </header>

    <div class="maker-layout">
      <aside class="maker-sidebar left">
        <div class="maker-panel-title">Hierarchy</div>
        <div id="maker-hierarchy"></div>
        <div class="maker-panel-title">Add</div>
        <div id="maker-palette"></div>
      </aside>

      <div class="maker-viewport">
        <canvas id="MakerCanvas"></canvas>
      </div>

      <aside class="maker-sidebar right">
        <div class="maker-panel-title">Properties</div>
        <div id="maker-properties"></div>
      </aside>
    </div>

    <footer class="maker-status" id="maker-status">Not bound to a project folder</footer>

    <script type="module">
      import { MakerApp } from "/packages/tools/src/maker/MakerApp.ts";
      import { RendererType } from "/packages/engine/src/enums/index.ts";

      const app = new MakerApp({
        canvasId: "MakerCanvas",
        rendererType: RendererType.BEST,
        fullscreen: true,
        hierarchyContainer: document.getElementById("maker-hierarchy"),
        propertyContainer: document.getElementById("maker-properties"),
        paletteContainer: document.getElementById("maker-palette"),
        statusContainer: document.getElementById("maker-status"),
      });

      window.makerApp = app;
      app.start();
    </script>
  </body>
</html>
