<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Splatter Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f111a;
      --bg-panel: rgba(22, 28, 45, 0.7);
      --bg-control: #1a1f35;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.1);
      --border-focus: rgba(59, 130, 246, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-control);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      background-color: rgba(15, 17, 26, 0.8);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 9999px;
      color: #93c5fd;
      font-weight: 500;
    }

    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 75px);
      position: relative;
    }

    /* Sidebar controls */
    .sidebar {
      width: 400px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 5;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1.75rem;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .control-group {
      margin-bottom: 1.75rem;
      background: rgba(26, 31, 53, 0.4);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.3s ease;
    }

    .control-group:hover {
      border-color: rgba(148, 163, 184, 0.2);
    }

    .control-row {
      margin-bottom: 1.25rem;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .value-display {
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }

    select, input[type="text"], input[type="color"] {
      width: 100%;
      background: var(--bg-control);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Range slider styling */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-control);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: all 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Preset color swatches */
    .color-presets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .color-preset {
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .color-preset:hover {
      transform: translateY(-2px);
      border-color: var(--text-main);
    }

    .sidebar-actions {
      padding: 1.25rem 1.75rem;
      border-top: 1px solid var(--border);
      background: rgba(15, 17, 26, 0.4);
      display: flex;
      gap: 0.75rem;
    }

    button {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    .btn-primary:hover {
      background: #2563eb;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-control);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #222a47;
      border-color: rgba(148, 163, 184, 0.3);
    }

    /* Main viewport area */
    .viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090a10;
      padding: 2rem;
      position: relative;
    }

    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #131722 0%, #090a10 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    /* Checkerboard pattern for transparency */
    .checkerboard {
      position: absolute;
      width: 512px;
      height: 512px;
      background-image: 
        linear-gradient(45deg, #181d30 25%, transparent 25%), 
        linear-gradient(-45deg, #181d30 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #181d30 75%), 
        linear-gradient(-45deg, transparent 75%, #181d30 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      z-index: 2;
    }

    /* Bottom Info & Code Panel */
    .code-panel {
      margin-top: 1.5rem;
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 250px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-header {
      padding: 0.75rem 1.25rem;
      background: rgba(15, 17, 26, 0.6);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .code-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;

    .code-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .code-tab:hover:not(.active) {
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
    }

    pre {
      flex: 1;
      overflow: auto;
      padding: 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #a5b4fc;
      background: #0b0d16;
    }

    /* Utility Styles */
    .d-none {
      display: none !important;
    }

    .preset-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

</head>

  <script>
    // ----------------------------------------------------
    // Simple 2D Perlin Noise Implementation (Pure JS)
    // ----------------------------------------------------
    class Perlin {
      constructor(seedValue) {
        this.p = new Uint8Array(256);
        this.permutation = new Uint8Array(512);
        this.init(seedValue);
      }
      
      init(seedValue) {
        // Simple LCG pseudo-random generator based on seed
        let seed = seedValue || Math.random();
        const rand = () => {
          const x = Math.sin(seed++) * 10000;
          return x - Math.floor(x);
        };

        for (let i = 0; i < 256; i++) {
          this.p[i] = i;
        }
        
        // Shuffle using seed
        for (let i = 255; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          const tmp = this.p[i];
          this.p[i] = this.p[j];
          this.p[j] = tmp;
        }
        
        // Populate double permutation array
        for (let i = 0; i < 512; i++) {
          this.permutation[i] = this.p[i & 255];
        }
      }

      fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      lerp(t, a, b) {
        return a + t * (b - a);
      }

      grad(hash, x, y) {
        const h = hash & 7;
        const gradX = [1, -1, 0, 0, 1, -1, 1, -1][h];
        const gradY = [0, 0, 1, -1, 1, 1, -1, -1][h];
        return x * gradX + y * gradY;
      }

      noise(x, y) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        
        x -= Math.floor(x);
        y -= Math.floor(y);
        
        const u = this.fade(x);
        const v = this.fade(y);
        
        const A = this.permutation[X] + Y;
        const B = this.permutation[X + 1] + Y;
        
        return this.lerp(v,
          this.lerp(u, this.grad(this.permutation[A], x, y), this.grad(this.permutation[B], x - 1, y)),
          this.lerp(u, this.grad(this.permutation[A + 1], x, y - 1), this.grad(this.permutation[B + 1], x - 1, y - 1))
        );
      }
    }

    // Helper: Hex color to RGB object
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }

    // ----------------------------------------------------
    // Drawing Implementations
    // ----------------------------------------------------
    
    // Technique 1: Noise-Warped Circle
    function drawNoiseWarpedCircle(ctx, width, height, options, perlinInstance) {
      const { radius, frequency, amplitude, satellites, satelliteRange, color } = options;
      
      const cx = width / 2;
      const cy = height / 2;
      
      ctx.fillStyle = color;
      
      // Draw main blob
      ctx.beginPath();
      const numPoints = 200;
      for (let i = 0; i <= numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const nx = Math.cos(angle);
        const ny = Math.sin(angle);
        
        // Circular sample path in 2D noise space to ensure seam-free shape
        const noiseVal = perlinInstance.noise(nx * frequency + 1.2, ny * frequency + 3.7);
        const r = radius + noiseVal * amplitude;
        
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.closePath();
      ctx.fill();
      
      // Draw radial satellite droplets
      const randSeed = options.seed * 9.87;
      let randVal = Math.sin(randSeed);
      const seededRand = () => {
        randVal = Math.sin(randVal * 10000);
        return randVal - Math.floor(randVal);
      };

      for (let i = 0; i < satellites; i++) {
        const angle = seededRand() * Math.PI * 2;
        const distanceVal = radius * (1.1 + seededRand() * (satelliteRange - 1.0));
        const satRadius = (3 + seededRand() * 6) * (radius / 120);
        
        const sx = cx + Math.cos(angle) * distanceVal;
        const sy = cy + Math.sin(angle) * distanceVal;
        
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(angle);
        ctx.scale(1.4, 0.7); // Stretched radially to represent fly-off momentum
        ctx.beginPath();
        ctx.arc(0, 0, satRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Technique 2: Metaballs
    function drawMetaballs(ctx, width, height, options) {
      const { radius, blobCount, blur, threshold, color, satellites } = options;
      
      const offscreen = document.createElement('canvas');
      offscreen.width = width;
      offscreen.height = height;
      const octx = offscreen.getContext('2d');
      
      octx.fillStyle = '#ffffff';
      octx.clearRect(0, 0, width, height);
      
      const cx = width / 2;
      const cy = height / 2;
      
      // Seeded random helper
      let randVal = Math.sin(options.seed);
      const seededRand = () => {
        randVal = Math.sin(randVal * 9876.54);
        return randVal - Math.floor(randVal);
      };

      // Draw central circle
      octx.beginPath();
      octx.arc(cx, cy, radius * 0.85, 0, Math.PI * 2);
      octx.fill();
      
      // Draw secondary clustered circles
      for (let i = 0; i < blobCount; i++) {
        const angle = seededRand() * Math.PI * 2;
        const dist = radius * (0.2 + seededRand() * 0.65);
        const blobRadius = radius * (0.2 + seededRand() * 0.3);
        
        const bx = cx + Math.cos(angle) * dist;
        const by = cy + Math.sin(angle) * dist;
        
        octx.beginPath();
        octx.arc(bx, by, blobRadius, 0, Math.PI * 2);
        octx.fill();
      }
      
      // Draw satellites
      for (let i = 0; i < satellites; i++) {
        const angle = seededRand() * Math.PI * 2;
        const dist = radius * (1.1 + seededRand() * 0.5);
        const satRadius = radius * (0.05 + seededRand() * 0.1);
        
        octx.beginPath();
        octx.arc(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist, satRadius, 0, Math.PI * 2);
        octx.fill();
      }
      
      // Blur the circles onto the destination canvas
      ctx.clearRect(0, 0, width, height);
      ctx.filter = `blur(${blur}px)`;
      ctx.drawImage(offscreen, 0, 0);
      ctx.filter = 'none';
      
      // Apply alpha thresholding and replace color
      const imgData = ctx.getImageData(0, 0, width, height);
      const pixels = imgData.data;
      const rgb = hexToRgb(color) || { r: 74, g: 55, b: 40 };
      
      for (let i = 0; i < pixels.length; i += 4) {
        const alpha = pixels[i + 3];
        if (alpha > threshold) {
          // Antialiased edge transition
          const smoothRange = 6;
          if (alpha < threshold + smoothRange) {
            const factor = (alpha - threshold) / smoothRange;
            pixels[i] = rgb.r;
            pixels[i + 1] = rgb.g;
            pixels[i + 2] = rgb.b;
            pixels[i + 3] = Math.floor(factor * 255);
          } else {
            pixels[i] = rgb.r;
            pixels[i + 1] = rgb.g;
            pixels[i + 2] = rgb.b;
            pixels[i + 3] = 255;
          }
        } else {
          pixels[i + 3] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // Technique 3: Mud Splatter (Warped Circles + Blurred Metaballs + Thresholding)
    function drawMudSplatter(ctx, width, height, options, perlinInstance) {
      const { radius, blobCount, blur, threshold, warpStrength, satellites, color } = options;
      
      const offscreen = document.createElement('canvas');
      offscreen.width = width;
      offscreen.height = height;
      const octx = offscreen.getContext('2d');
      
      octx.fillStyle = '#ffffff';
      octx.clearRect(0, 0, width, height);
      
      const cx = width / 2;
      const cy = height / 2;
      
      // Seeded random helper
      let randVal = Math.sin(options.seed * 3.4);
      const seededRand = () => {
        randVal = Math.sin(randVal * 12345.6);
        return randVal - Math.floor(randVal);
      };

      // Draw warped main blob and warped cluster blobs
      const drawWarpedArc = (ctxDest, x, y, baseRadius, freq, seedOffset) => {
        ctxDest.beginPath();
        const pts = 80;
        for (let j = 0; j <= pts; j++) {
          const angle = (j / pts) * Math.PI * 2;
          const nx = Math.cos(angle);
          const ny = Math.sin(angle);
          const n = perlinInstance.noise(nx * freq + seedOffset, ny * freq - seedOffset);
          const r = baseRadius + n * warpStrength;
          
          const px = x + Math.cos(angle) * r;
          const py = y + Math.sin(angle) * r;
          if (j === 0) ctxDest.moveTo(px, py);
          else ctxDest.lineTo(px, py);
        }
        ctxDest.closePath();
        ctxDest.fill();
      };

      // Draw warped central body
      drawWarpedArc(octx, cx, cy, radius * 0.8, 2.0, 1.25);

      // Draw warped secondary blobs
      for (let i = 0; i < blobCount; i++) {
        const angle = seededRand() * Math.PI * 2;
        const dist = radius * (0.2 + seededRand() * 0.65);
        const subRadius = radius * (0.15 + seededRand() * 0.25);
        const bx = cx + Math.cos(angle) * dist;
        const by = cy + Math.sin(angle) * dist;
        drawWarpedArc(octx, bx, by, subRadius, 2.5, 12.5 + i * 4.3);
      }
      
      // Draw flying droplets (ellipses stretched radially)
      for (let i = 0; i < satellites; i++) {
        const angle = seededRand() * Math.PI * 2;
        const dist = radius * (1.1 + seededRand() * 0.7);
        const satRadius = radius * (0.04 + seededRand() * 0.08);
        
        const sx = cx + Math.cos(angle) * dist;
        const sy = cy + Math.sin(angle) * dist;
        
        octx.save();
        octx.translate(sx, sy);
        octx.rotate(angle);
        octx.scale(1.4, 0.75); // Teardrop/flying shape
        octx.beginPath();
        octx.arc(0, 0, satRadius, 0, Math.PI * 2);
        octx.fill();
        octx.restore();
      }
      
      // Blur offscreen canvas into main canvas
      ctx.clearRect(0, 0, width, height);
      ctx.filter = `blur(${blur}px)`;
      ctx.drawImage(offscreen, 0, 0);
      ctx.filter = 'none';
      
      // Threshold
      const imgData = ctx.getImageData(0, 0, width, height);
      const pixels = imgData.data;
      const rgb = hexToRgb(color) || { r: 74, g: 55, b: 40 };
      
      for (let i = 0; i < pixels.length; i += 4) {
        const alpha = pixels[i + 3];
        if (alpha > threshold) {
          const smoothRange = 6;
          if (alpha < threshold + smoothRange) {
            const factor = (alpha - threshold) / smoothRange;
            pixels[i] = rgb.r;
            pixels[i + 1] = rgb.g;
            pixels[i + 2] = rgb.b;
            pixels[i + 3] = Math.floor(factor * 255);
          } else {
            pixels[i] = rgb.r;
            pixels[i + 1] = rgb.g;
            pixels[i + 2] = rgb.b;
            pixels[i + 3] = 255;
          }
        } else {
          pixels[i + 3] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // ----------------------------------------------------
    // State & UI Handlers
    // ----------------------------------------------------
    
    let currentSeed = Math.random() * 1000;
    const canvas = document.getElementById('splat-canvas');
    const ctx = canvas.getContext('2d');
    let perlin = new Perlin(currentSeed);

    const inputs = {
      algorithm: document.getElementById('algorithm-select'),
      radius: document.getElementById('radius-slider'),
      colorPicker: document.getElementById('color-picker'),
      colorHex: document.getElementById('color-hex'),
      size: document.getElementById('size-select'),
      
      // Noise Warp
      noiseFreq: document.getElementById('noise-freq-slider'),
      noiseAmp: document.getElementById('noise-amp-slider'),
      warpSat: document.getElementById('warp-sat-slider'),
      warpSatDist: document.getElementById('warp-sat-dist-slider'),

      // Metaballs
      blobCount: document.getElementById('blob-count-slider'),
      blur: document.getElementById('blur-slider'),
      threshold: document.getElementById('threshold-slider'),
      metaSat: document.getElementById('meta-sat-slider'),

      // Mud
      mudBlob: document.getElementById('mud-blob-slider'),
      mudWarp: document.getElementById('mud-warp-slider'),
      mudBlur: document.getElementById('mud-blur-slider'),
      mudThresh: document.getElementById('mud-thresh-slider'),
      mudSat: document.getElementById('mud-sat-slider')
    };

    const valueDisplays = {
      radius: document.getElementById('radius-val'),
      color: document.getElementById('color-val'),
      noiseFreq: document.getElementById('noise-freq-val'),
      noiseAmp: document.getElementById('noise-amp-val'),
      warpSat: document.getElementById('warp-sat-val'),
      warpSatDist: document.getElementById('warp-sat-dist-val'),
      blobCount: document.getElementById('blob-count-val'),
      blur: document.getElementById('blur-val'),
      threshold: document.getElementById('threshold-val'),
      metaSat: document.getElementById('meta-sat-val'),
      mudBlob: document.getElementById('mud-blob-val'),
      mudWarp: document.getElementById('mud-warp-val'),
      mudBlur: document.getElementById('mud-blur-val'),
      mudThresh: document.getElementById('mud-thresh-val'),
      mudSat: document.getElementById('mud-sat-val')
    };

    // Toggle panels based on selected algorithm
    function updateActivePanel() {
      const algo = inputs.algorithm.value;
      
      document.getElementById('panel-noise-warp').classList.add('d-none');
      document.getElementById('panel-metaballs').classList.add('d-none');
      document.getElementById('panel-mud-splatter').classList.add('d-none');

      if (algo === 'noise-warp') {
        document.getElementById('panel-noise-warp').classList.remove('d-none');
      } else if (algo === 'metaballs') {
        document.getElementById('panel-metaballs').classList.remove('d-none');
      } else if (algo === 'mud-splatter') {
        document.getElementById('panel-mud-splatter').classList.remove('d-none');
      }
    }

    // Main Draw Trigger
    function draw() {
      const algo = inputs.algorithm.value;
      const width = canvas.width;
      const height = canvas.height;
      const color = inputs.colorHex.value;

      const baseOptions = {
        radius: parseInt(inputs.radius.value),
        color: color,
        seed: currentSeed
      };

      if (algo === 'noise-warp') {
        const options = {
          ...baseOptions,
          frequency: parseFloat(inputs.noiseFreq.value),
          amplitude: parseInt(inputs.noiseAmp.value),
          satellites: parseInt(inputs.warpSat.value),
          satelliteRange: parseFloat(inputs.warpSatDist.value)
        };
        drawNoiseWarpedCircle(ctx, width, height, options, perlin);
      } else if (algo === 'metaballs') {
        const options = {
          ...baseOptions,
          blobCount: parseInt(inputs.blobCount.value),
          blur: parseInt(inputs.blur.value),
          threshold: parseInt(inputs.threshold.value),
          satellites: parseInt(inputs.metaSat.value)
        };
        drawMetaballs(ctx, width, height, options);
      } else if (algo === 'mud-splatter') {
        const options = {
          ...baseOptions,
          blobCount: parseInt(inputs.mudBlob.value),
          warpStrength: parseInt(inputs.mudWarp.value),
          blur: parseInt(inputs.mudBlur.value),
          threshold: parseInt(inputs.mudThresh.value),
          satellites: parseInt(inputs.mudSat.value)
        };
        drawMudSplatter(ctx, width, height, options, perlin);
      }

      updateCodeDisplay();
    }

    // Update Slider text display
    function updateValueDisplays() {
      valueDisplays.radius.innerText = inputs.radius.value;
      valueDisplays.color.innerText = inputs.colorHex.value;
      valueDisplays.noiseFreq.innerText = inputs.noiseFreq.value;
      valueDisplays.noiseAmp.innerText = inputs.noiseAmp.value;
      valueDisplays.warpSat.innerText = inputs.warpSat.value;
      valueDisplays.warpSatDist.innerText = inputs.warpSatDist.value;
      valueDisplays.blobCount.innerText = inputs.blobCount.value;
      valueDisplays.blur.innerText = inputs.blur.value;
      valueDisplays.threshold.innerText = inputs.threshold.value;
      valueDisplays.metaSat.innerText = inputs.metaSat.value;
      valueDisplays.mudBlob.innerText = inputs.mudBlob.value;
      valueDisplays.mudWarp.innerText = inputs.mudWarp.value;
      valueDisplays.mudBlur.innerText = inputs.mudBlur.value;
      valueDisplays.mudThresh.innerText = inputs.mudThresh.value;
      valueDisplays.mudSat.innerText = inputs.mudSat.value;
    }

    // Code Generation & Display
    let activeTab = 'js';
    
    function updateCodeDisplay() {
      const codeBox = document.getElementById('code-content');
      const algo = inputs.algorithm.value;
      const color = inputs.colorHex.value;
      const radius = inputs.radius.value;

      if (activeTab === 'js') {
        if (algo === 'noise-warp') {
          codeBox.innerText = `// JavaScript & Canvas 2D: Seamless Noise-Warped Splatter
function drawWarpedSplatter(ctx, cx, cy) {
  const baseRadius = ${radius};
  const freq = ${inputs.noiseFreq.value};
  const amp = ${inputs.noiseAmp.value};
  const numPoints = 200;

  ctx.fillStyle = "${color}";
  ctx.beginPath();
  for (let i = 0; i <= numPoints; i++) {
    const angle = (i / numPoints) * Math.PI * 2;
    const nx = Math.cos(angle);
    const ny = Math.sin(angle);
    
    // Sample Perlin noise along circle to make it seamless
    const noiseVal = noise2D(nx * freq, ny * freq);
    const r = baseRadius + noiseVal * amp;
    
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}`;
        } else if (algo === 'metaballs') {
          codeBox.innerText = `// JavaScript & Canvas 2D: Liquid Metaballs
function drawMetaballs(ctx, cx, cy) {
  const radius = ${radius};
  const blobCount = ${inputs.blobCount.value};
  const blur = ${inputs.blur.value};
  const threshold = ${inputs.threshold.value};
  
  // 1. Draw circles on offscreen canvas
  const offscreen = document.createElement('canvas');
  const octx = offscreen.getContext('2d');
  octx.fillStyle = '#ffffff';
  
  // Draw center and secondary circles
  octx.arc(cx, cy, radius * 0.85, 0, Math.PI * 2);
  // ... Draw secondary randomly distributed circles ...
  
  // 2. Render to main canvas with blur filter
  ctx.filter = \`blur(\${blur}px)\`;
  ctx.drawImage(offscreen, 0, 0);
  ctx.filter = 'none';
  
  // 3. Threshold pixel alpha to form sharp liquid shapes
  const imgData = ctx.getImageData(0, 0, width, height);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] > threshold) {
      data[i] = 74; // R color
      data[i + 1] = 55; // G color
      data[i + 2] = 40; // B color
      data[i + 3] = 255;
    } else {
      data[i + 3] = 0;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}`;
        } else {
          codeBox.innerText = `// JavaScript & Canvas 2D: Combined Mud Splatter
// Draws multiple warped circle blobs, blurs them, and thresholds the alpha.
function drawMudSplatter(ctx, cx, cy) {
  const radius = ${radius};
  const blurVal = ${inputs.mudBlur.value};
  const thresholdVal = ${inputs.mudThresh.value};
  
  // 1. Draw warped circles onto an offscreen canvas
  // 2. Draw flying teardrop scale/rotated ellipses (satellites)
  // 3. Draw offscreen to destination canvas using: ctx.filter = "blur(" + blurVal + "px)"
  // 4. Run a threshold loop on alpha channel:
  //    if (alpha > thresholdVal) alpha = 255; else alpha = 0;
}`;
        }
      } else {
        // Shader Code View
        codeBox.innerText = `// WebGPU WGSL Conceptual Fragment Shader
@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4f {
  let uv = in.uv - vec2f(0.5);
  let dist = length(uv);
  let angle = atan2(uv.y, uv.x);
  
  // Sample 2D simplex noise seamlessly in a circle
  let noise_coord = vec2f(cos(angle), sin(angle)) * ${inputs.noiseFreq?.value || "2.5"};
  let n = snoise(noise_coord);
  
  // Distort circle boundary
  let radius = 0.25 + n * ${(inputs.noiseAmp?.value || "40") / 500};
  
  // Hard edge thresholding using smoothstep
  let edge = smoothstep(radius + 0.005, radius - 0.005, dist);
  
  let splatter_color = vec3f(0.29, 0.215, 0.15); // Mud brown
  return vec4f(splatter_color, edge);
}`;
      }
    }

    // ----------------------------------------------------
    // Event Listeners
    // ----------------------------------------------------
    
    // Sliders & Inputs
    Object.values(inputs).forEach(input => {
      input.addEventListener('input', () => {
        if (input === inputs.colorPicker) {
          inputs.colorHex.value = inputs.colorPicker.value;
        } else if (input === inputs.colorHex) {
          inputs.colorPicker.value = inputs.colorHex.value;
        }
        updateActivePanel();
        updateValueDisplays();
        draw();
      });
    });

    inputs.algorithm.addEventListener('change', () => {
      updateActivePanel();
      draw();
    });

    inputs.size.addEventListener('change', () => {
      const s = parseInt(inputs.size.value);
      canvas.width = s;
      canvas.height = s;
      document.querySelector('.checkerboard').style.width = s + 'px';
      document.querySelector('.checkerboard').style.height = s + 'px';
      draw();
    });

    // Preset color buttons
    document.querySelectorAll('.color-preset').forEach(preset => {
      preset.addEventListener('click', () => {
        const color = preset.getAttribute('data-color');
        inputs.colorHex.value = color;
        inputs.colorPicker.value = color;
        updateValueDisplays();
        draw();
      });
    });

    // Re-seed button
    document.getElementById('btn-seed').addEventListener('click', () => {
      currentSeed = Math.random() * 1000;
      perlin = new Perlin(currentSeed);
      draw();
    });

    // Download PNG Button
    document.getElementById('btn-download').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `splatter_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Tabs
    document.querySelectorAll('.code-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.getAttribute('data-tab');
        updateCodeDisplay();
      });
    });

    // Copy Code Button
    document.getElementById('btn-copy').addEventListener('click', () => {
      const code = document.getElementById('code-content').innerText;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('btn-copy');
        btn.innerText = 'Copied!';
        setTimeout(() => {
          btn.innerText = 'Copy Code';
        }, 1500);
      });
    });

    // Initial setup
    updateActivePanel();
    updateValueDisplays();
    draw();
  </script>
</body>
