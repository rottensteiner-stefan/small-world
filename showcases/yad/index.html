<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmallWorld - YAD (Yet Another Doom)</title>
    <link rel="stylesheet" href="../../public/assets/shared.css" />
    <style>
      body {
        background-color: black;
        background-image: url('./assets/doom_pack/textures/flat1_1.png');
        background-repeat: repeat;
        background-size: 256px 256px; /* Massive scale so pixels match the game */
        image-rendering: pixelated;
        box-shadow: inset 0 0 50px rgba(0,0,0,0.8); /* Optional: slight shadow to frame it */
      }
      #retro-screen {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        overflow: hidden;
        background-color: #000;
        container-type: size;
      }
      /* Weapon */
      #weapon-container {
        position: absolute;
        bottom: 32px; /* Offset to sit exactly on top of the 32px HUD */
        left: 50%;
        transform: translateX(-50%);
        z-index: 9000;
        pointer-events: none;
      }
      #weapon-img {
        height: 100px; /* Sized for 200px tall screen */
        image-rendering: pixelated;
        transform-origin: bottom center;
        transition: transform 0.1s;
      }
      .weapon-shoot {
        transform: scale(1.1) translateY(20px) rotate(-5deg);
      }
    </style>
  </head>
  <body>
    <div id="retro-screen">
      <canvas id="SmallWorld"></canvas>
      
      <div id="weapon-container">
        <img id="weapon-img" src="./assets/weapon.png" alt="Weapon" />
      </div>
    </div>

    <script type="module" src="/src/apps/yad/YadApp.ts"></script>
    
    <script>
      const weaponImg = document.getElementById("weapon-img");
      
      // Weapon recoil animation
      window.addEventListener("yad-shoot", () => {
         weaponImg.classList.add("weapon-shoot");
         setTimeout(() => weaponImg.classList.remove("weapon-shoot"), 100);
      });
    </script>
  </body>
</html>
