<!doctype html>
<html lang="de">
  <head>
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>And Now? — Prologue (Flakturm Arenberg 2100)</title>
    <link rel="stylesheet" href="/assets/shared.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #060709;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e2e8f0;
        user-select: none;
      }

      #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }

      /* CRT Scanline Overlay */
      .scanlines-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%, 
          rgba(0, 0, 0, 0.25) 50%
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 10;
      }

      /* Top Header HUD */
      header#hud-header {
        position: absolute;
        top: 1.5rem;
        left: 2rem;
        z-index: 20;
        pointer-events: none;
      }

      .badge {
        display: inline-block;
        background: rgba(212, 154, 61, 0.15);
        color: #ffb84d;
        border: 1px solid rgba(212, 154, 61, 0.4);
        padding: 0.3rem 0.8rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 0.4rem;
      }

      h1.hud-title {
        font-size: 1.6rem;
        color: #fff;
        margin: 0;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      /* Bottom Subtitle / Dialogue Bar */
      .dialogue-container {
        position: absolute;
        bottom: 5.5rem;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 800px;
        background: rgba(10, 12, 16, 0.92);
        border: 1px solid rgba(255, 184, 77, 0.3);
        border-left: 4px solid #ffb84d;
        padding: 1.25rem 1.75rem;
        border-radius: 8px;
        z-index: 25;
        backdrop-filter: blur(10px);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      }

      .speaker-label {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #ffb84d;
        margin-bottom: 0.35rem;
      }

      .speaker-dialogue {
        font-size: 1.1rem;
        line-height: 1.5;
        color: #ffffff;
        font-style: italic;
      }

      /* Interactive Choices Modal */
      .choice-container {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 85%;
        max-width: 580px;
        background: rgba(14, 16, 23, 0.96);
        border: 1px solid #ffb84d;
        border-radius: 12px;
        padding: 1.75rem;
        z-index: 35;
        box-shadow: 0 0 60px rgba(255, 184, 77, 0.25);
        display: none;
      }

      .choice-title {
        font-size: 0.9rem;
        color: #ffb84d;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
      }

      .choice-button {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        padding: 0.9rem 1.2rem;
        margin-bottom: 0.75rem;
        border-radius: 8px;
        text-align: left;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .choice-button:hover {
        background: rgba(255, 184, 77, 0.2);
        border-color: #ffb84d;
        transform: translateX(6px);
      }

      /* Bottom Timeline Bar */
      .timeline-bar {
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 800px;
        background: rgba(15, 17, 23, 0.9);
        border: 1px solid #242936;
        border-radius: 10px;
        padding: 0.75rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 1.2rem;
        z-index: 30;
        backdrop-filter: blur(8px);
      }

      .btn-action {
        background: #ffb84d;
        color: #000;
        font-weight: 700;
        border: none;
        padding: 0.5rem 1.2rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.2s ease, transform 0.1s ease;
      }

      .btn-action:hover {
        background: #ffc466;
        transform: scale(1.02);
      }

      .timeline-rail {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }

      .timeline-fill {
        width: 0%;
        height: 100%;
        background: #ffb84d;
        transition: width 0.1s linear;
      }

      .timer-label {
        font-family: monospace;
        font-size: 0.9rem;
        color: #8a99ad;
        min-width: 60px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="scanlines-overlay"></div>

    <header id="hud-header">
      <span class="badge">Akt I — Prolog</span>
      <h1 class="hud-title">Bunker Arenberg // Koje 42</h1>
    </header>

    <!-- Subtitle Dialogue -->
    <div class="dialogue-container">
      <div class="speaker-label" id="subSpeaker">Prolog — Flakturm Arenberg</div>
      <div class="speaker-dialogue" id="subText">
        (Dumpfes, metallisches Pochen gegen die Panzertür hallt durch den Raum...)
      </div>
    </div>

    <!-- Interactive Choice Modal -->
    <div class="choice-container" id="dialogChoice">
      <div class="choice-title">Deine Frage an Herrn Hawelka:</div>
      <button class="choice-button" id="btnQuestion1">
        1. „Wer hat František gefunden? Wo lag er genau?!“
      </button>
      <button class="choice-button" id="btnQuestion2">
        2. „Warum gibst du mir das Gerät, statt es der Kanzlei zu melden?“
      </button>
    </div>

    <!-- Bottom Timeline Controls -->
    <div class="timeline-bar">
      <button class="btn-action" id="btnPlay">▶ Szene Starten</button>
      <div class="timeline-rail">
        <div class="timeline-fill" id="timelineProgress"></div>
      </div>
      <div class="timer-label" id="timerText">00:00 / 01:00</div>
    </div>

    <!-- Engine Canvas -->
    <canvas id="SmallWorld"></canvas>

    <script type="module" src="./prologue.ts"></script>
  </body>
</html>
