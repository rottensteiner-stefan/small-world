name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (src, showcases, tests)
        run: npm run typecheck

      - name: Lint (src, showcases, tests)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  showcases-smoke-test:
    runs-on: ubuntu-latest
    # Informational only: headless Chrome in CI can't reliably init WebGPU pipelines
    # (software-rendering texture-limit issues), so this job is expected to be flaky
    # for WebGPU-path showcases. Never block merges on it.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Showcase visual smoke test
        run: npm run test:showcases
